---
# playbooks/roles/python/tasks/main.yml
# - name: Include OS-specific variables
#   include_vars: "{{ ansible_os_family }}.yml"
#   tags: ["java"]

- name: Update package cache
  package:
    update_cache: yes
  tags: ["python"]

- name: Install Python3
  package:
    name: python3
    state: present
  tags: ["python"]

- name: Install Jenkins agent dependencies
  package:
    name:
      - git
      - wget
      - unzip
    state: present
  tags: ["python", "agent"]

- name: Create Jenkins agent user
  user:
    name: python-node
    comment: "Jenkins Agent User"
    shell: /bin/bash
    createhome: yes
    home: /home/python-node
  tags: ["python", "agent"]

- name: Create Jenkins agent workspace directory
  file:
    path: /home/python-node/workspace
    state: directory
    owner: python-node
    group: python-node
    mode: "0755"
  tags: ["python", "agent"]

- name: Configure SSH for Jenkins agent
  file:
    path: /home/python-node/.ssh
    state: directory
    owner: python-node
    group: python-node
    mode: "0700"
  tags: ["python", "agent", "ssh"]

- name: Verify Python3 installation
  command: python3 --version
  register: python3_version_output
  changed_when: false
  tags: ["python", "verify"]

- name: Display Python version
  debug:
    msg: "{{ python3_version_output.stdout_lines }}"
  tags: ["python", "verify"]
